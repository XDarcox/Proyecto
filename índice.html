<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora de Precio Total</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="container my-5">
        <h1 class="mb-4 text-center">Calculadora de Precio Total</h1>
        <form id="price-form" class="w-100 mw-400px mx-auto p-4 rounded shadow-sm bg-light">
            <div class="mb-3">
                <label for="price" class="form-label">Precio (sin impuestos) €=(euros)</label>
                <input type="number" step="0.01" class="form-control" id="price" placeholder="Ingrese precio" required />
            </div>
            <div class="mb-3">
                <label for="tax" class="form-label">Porcentaje de impuestos (%)</label>
                <input type="number" step="0.01" class="form-control" id="tax" placeholder="Ingrese porcentaje de impuestos" required />
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">
                    <span class="material-icons align-middle">calculate</span>
                    Calcular Total
                </button>
                <button type="reset" class="btn btn-outline-secondary">
                    <span class="material-icons align-middle">restart_alt</span>
                    Reiniciar
                </button>
            </div>
        </form>
        <div id="result" class="mt-4 text-center fs-5"></div>
    </main>

    <script src="script.js"></script>
    <!-- Bootstrap JS Bundle with Popper (optional for dropdowns/tooltips) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
